<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Couples Tracker PWA</title>

    <link rel="manifest" href="/manifest.json">

    <link rel="stylesheet" href="https://unpkg.com" />

    <style>

        body { margin: 0; padding: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }

        #controls { padding: 10px; background: #fff; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; gap: 10px; }

        #map { flex-grow: 1; width: 100%; }

        button { padding: 8px 12px; font-weight: bold; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; }

        #start { background: #4CAF50; color: white; }

        #stop { background: #f44336; color: white; }

    </style>

</head>

<body>

    <div id="controls">

        <input type="text" id="room" placeholder="Couple Room ID" value="couple-default">

        <input type="text" id="user" placeholder="Your Name" value="Partner A">

        <button id="start">Start Sharing</button>

        <button id="stop">Stop Sharing</button>

    </div>

    <div id="map"></div>



    <script src="/socket.io/socket.io.js"></script>

    <script src="https://unpkg.com"></script>

    <script>

        const socket = io();

        let map, markers = {}, pathLines = {}, watchId = null;



        // Start map visualization centered layout

        map = L.map('map').setView([53.3498, -6.2603], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);



        const roomInput = document.getElementById('room');

        const userInput = document.getElementById('user');



        function drawRoutePoint(user, lat, lng) {

            const color = user === userInput.value ? 'blue' : 'red';

            

            // Render point pin indicator

            if (!markers[user]) {

                markers[user] = L.marker([lat, lng]).addTo(map).bindPopup(user).openPopup();

            } else {

                markers[user].setLatLng([lat, lng]);

            }



            // Append trail sequence line

            if (!pathLines[user]) {

                pathLines[user] = L.polyline([], {color: color, weight: 4}).addTo(map);

            }

            pathLines[user].addLatLng([lat, lng]);

        }



        socket.on('historyData', (rows) => {

            rows.forEach(row => drawRoutePoint(row.user, row.lat, row.lng));

        });



        socket.on('receiveLocation', (data) => {

            drawRoutePoint(data.user, data.lat, data.lng);

        });



        document.getElementById('start').addEventListener('click', () => {

            const room = roomInput.value;

            const user = userInput.value;

            socket.emit('joinRoom', { room });



            if (navigator.geolocation) {

                watchId = navigator.geolocation.watchPosition((position) => {

                    const { latitude, longitude } = position.coords;

                    socket.emit('sendLocation', { room, user, lat: latitude, lng: longitude });

                }, console.error, { enableHighAccuracy: true });

            }

        });



        document.getElementById('stop').addEventListener('click', () => {

            if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }

        });



        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }

    </script>

</body>

</html>
